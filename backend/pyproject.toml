[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataagent-backend"
version = "0.1.0"
description = "Backend foundation for the Data Scientist Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "sqlglot>=25.0",
    "sqlalchemy>=2.0",
    "rich>=13.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.pyrefly]
search-path = ["src", "tests"]

[tool.pyright]
extraPaths = ["src", "tests"]

